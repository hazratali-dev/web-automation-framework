[project]
name = "web-automation"
version = "0.1.0"
description = "Distributed web automation framework — performance monitoring, competitor analysis, UX simulation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "rich>=13.9",
    "cryptography>=43.0",
    "httpx[socks]>=0.27",
    "typer>=0.13",
    "playwright>=1.47",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
